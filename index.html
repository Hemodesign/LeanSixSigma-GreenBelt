{t:"f",x:"Tahtiaika = käytettävissä oleva työaika / asiakaskysyntä\n\nEsim. 450 min / 90 kpl = 5 min/kpl"},
{t:"p",x:"Tahtiaika on kysynnän rytmi. Jos vaiheen sykliaika ylittää tahtiajan, siitä muodostuu pullonkaula."},
{t:"h",x:"SMED ja poka-yoke"},
{t:"l",x:["<b>SMED</b> lyhentää asetusaikaa erottamalla sisäiset asetukset (kone seisoo) ulkoisista (voi tehdä käynnin aikana) ja siirtämällä mahdollisimman paljon sisäisistä ulkoisiksi. Lyhyt asetusaika mahdollistaa pienet eräkoot.","<b>Poka-yoke</b> on virheenesto: prosessi suunnitellaan niin, ettei virhettä voi tehdä tai se havaitaan välittömästi. Esimerkiksi liitin, joka menee vain oikein päin, tai lomake, joka ei lähetä ilman pakollista kenttää."]},
{t:"note",x:"Poka-yoke on FMEA:n kannalta arvokkain toimenpide, koska se laskee Occurrence-lukua eikä vain paranna havaitsemista."}],
q:[
{k:"mc",q:"Keskeneräisiä hakemuksia on 60 ja käsittelyteho 12 kpl/päivä. Mikä on läpimenoaika Littlen lain mukaan?",o:["5 päivää","12 päivää","0,2 päivää","72 päivää"],a:0,e:"60 / 12 = 5 päivää. Jonon puolittaminen puolittaisi läpimenoajan ilman kapasiteetin lisäystä."},
{k:"mc",q:"Käytettävissä 480 min/vrk ja kysyntä 120 kpl. Mikä on tahtiaika?",o:["4 min/kpl","2 min/kpl","8 min/kpl","0,25 min/kpl"],a:0,e:"480 / 120 = 4 minuuttia kappaletta kohden. Vaihe, jonka sykliaika ylittää 4 min, on pullonkaula."},
{k:"tf",q:"SMED:n ydin on siirtää mahdollisimman paljon sisäisiä asetuksia ulkoisiksi.",a:true,e:"Sisäinen asetus vaatii koneen pysäytyksen, ulkoinen ei. Siirto ulkoiseksi lyhentää seisokkia ja mahdollistaa pienemmät eräkoot."},
{k:"mc",q:"Mikä seuraavista on poka-yoke?",o:["Viikoittainen laatuauditointi","Lomake, joka ei lähde ilman pakollista kenttää","Kuukausiraportti virheistä","Lisäkoulutus"],a:1,e:"Poka-yoke estää virheen syntymisen rakenteellisesti. Auditoinnit ja raportit havaitsevat virheen vasta jälkikäteen."},
{k:"mc",q:"Mikä 5S:n vaihe epäonnistuu useimmin?",o:["Sortteeraus","Siivous","Seuranta eli ylläpito","Systematisointi"],a:2,e:"Ilman auditointia ja rutiinia työpiste palautuu ennalleen. Neljä ensimmäistä S:ää ovat projekti, viides on toimintatapa."},
{k:"match",q:"Yhdistä työkalu sen kohteeseen.",pairs:[["5S","Työpisteen järjestys ja etsimisen poisto"],["Kanban","Työn aloituksen ohjaus imulla"],["SMED","Asetusajan lyhentäminen"],["Poka-yoke","Virheen syntymisen estäminen"]],e:"5S ja SMED kohdistuvat aikaan, kanban virtaukseen ja poka-yoke laatuun."}]},

{id:"l44",title:"Pilotointi ja käyttöönoton suunnittelu",sub:"PDCA pienessä mittakaavassa ennen laajaa käyttöönottoa",
theory:[
{t:"p",x:"Todennettua ratkaisua ei viedä suoraan koko organisaatioon. <b>Pilotointi</b> testaa ratkaisun rajatussa, hallitussa mittakaavassa, jotta virheet ja yllätykset löytyvät halvalla ennen laajaa käyttöönottoa."},
{t:"h",x:"Pilotin suunnittelun osat"},
{t:"l",x:["<b>Kohde</b> — edustava mutta rajattu: yksi tiimi, linja tai alue, ei koko organisaatio.","<b>Kesto ja mittarit</b> — sama CTQ kuin charterissa, ennalta sovittu tavoiteraja ja aikaikkuna.","<b>Resurssit ja tuki</b> — tiimi on tavoitettavissa pilotin ajan ongelmatilanteissa.","<b>Poistumiskriteeri</b> — ennalta sovittu raja, jolloin pilotti keskeytetään hallitusti."]},
{t:"h",x:"PDCA pilotoinnin runkona"},
{t:"p",x:"<b>Plan</b> — suunnittele koe ja mittarit. <b>Do</b> — toteuta pienessä mittakaavassa. <b>Check</b> — vertaa tuloksia sekä tavoitteeseen että alkuperäiseen lähtötasoon. <b>Act</b> — vakiinnuta, säädä ja aja kierros uudelleen, tai hylkää ja palaa ratkaisuvaihtoehtoihin. Yksi PDCA-kierros riittää harvoin ensimmäisellä yrityksellä."},
{t:"note",x:"Pilotin onnistuminen yhdessä kohteessa ei takaa toimivuutta koko organisaatiossa. Eri vuoro, volyymi tai kulttuuri voi muuttaa tulosta — siksi laajennus tehdään vaiheittain, ei kertarysäyksellä."},
{t:"h",x:"Käyttöönottosuunnitelma"},
{t:"p",x:"Kun pilotti täyttää onnistumiskriteerit, laaditaan käyttöönottosuunnitelma: kuka tekee mitä, missä järjestyksessä (esim. yksikkö kerrallaan), millä koulutuksella ja viestinnällä, sekä <b>rollback-suunnitelma</b> — miten muutos perutaan, jos ilmenee vakava ongelma."},
{t:"tbl",h:["","Pilotti","Täysi käyttöönotto"],r:[
["Mittakaava","Rajattu kohde","Koko prosessi/organisaatio"],
["Riski toteutuessaan","Pieni, helposti rajattavissa","Suuri, vaikuttaa kaikkiin"],
["Tarkoitus","Testata ja oppia","Vakiinnuttaa ja hyödyntää"],
["Palautuvuus","Helppo perua","Vaatii rollback-suunnitelman"]]},
{t:"p",x:"Riskienhallinta ei pääty pilottiin: FMEA päivitetään uudelle prosessille ennen laajaa käyttöönottoa, koska uusi tapa tehdä työtä tuo lähes aina uusia vikaantumistapoja, joita alkuperäinen FMEA ei kattanut."}],
q:[
{k:"mc",q:"Miksi ratkaisu pilotoidaan ennen koko organisaation käyttöönottoa?",o:["Jotta projekti kestää pidempään","Jotta virheet ja yllätykset löytyvät pienessä, halvassa mittakaavassa","Koska Control-vaihe vaatii sitä muodollisesti","Jotta sponsori näkee raportin nopeammin"],a:1,e:"Pilotti rajaa mahdollisen virheen vaikutuksen pieneen kohteeseen ja tuottaa oppia ennen kuin riski kasvaa koko organisaation kokoiseksi."},
{k:"mc",q:"Mitä PDCA:n Check-vaihe tekee?",o:["Suunnittelee kokeen mittarit","Toteuttaa ratkaisun pienessä mittakaavassa","Vertaa pilotin tuloksia tavoitteeseen ja lähtötasoon","Kouluttaa koko henkilöstön"],a:2,e:"Check on vertailu- ja arviointivaihe: siinä päätetään, tukeeko data siirtymistä Act-vaiheeseen."},
{k:"tf",q:"Pilotin onnistuminen yhdessä tiimissä takaa, että ratkaisu toimii samalla tavalla koko organisaatiossa.",a:false,e:"Muut vuorot, volyymit tai kulttuurit voivat muuttaa tulosta. Siksi laajennus tehdään vaiheittain ja tuloksia seurataan matkan varrella."},
{k:"mc",q:"Pilotti keskeytyy hallitsemattomasti, koska kenelläkään ei ollut etukäteen sovittua rajaa sille, milloin se pysäytetään. Mikä pilotin suunnittelun osa puuttui?",o:["Kohteen rajaus","Poistumiskriteeri","PDCA-runko","Rollback-suunnitelma täydessä käyttöönotossa"],a:1,e:"Poistumiskriteeri (milloin pilotti keskeytetään hallitusti) pitää sopia etukäteen, ei tilanteen tullen."},
{k:"match",q:"Yhdistä käyttöönottosuunnitelman osa sisältöön.",pairs:[["Vaiheistus","Missä järjestyksessä ja millä aikataululla laajennus etenee"],["Koulutus","Varmistaa, että uusi tapa osataan ennen käyttöönottoa"],["Viestintä","Kertoo, mitä muuttuu, kenelle ja miksi"],["Rollback-suunnitelma","Kuvaa, miten muutos perutaan vakavassa ongelmassa"]],e:"Käyttöönottosuunnitelma vastaa kysymyksiin kuka, mitä, milloin ja mitä tehdään, jos jokin epäonnistuu."},
{k:"mc",q:"Miksi FMEA päivitetään ennen laajaa käyttöönottoa, vaikka pilotti onnistui?",o:["Koska alkuperäinen FMEA vanhenee ajan myötä automaattisesti","Koska uusi prosessi tuo lähes aina uusia vikaantumistapoja, joita vanha FMEA ei kata","Koska talousosasto vaatii sen ennen hyötyjen vahvistamista","Koska Control-vaihe ei voi alkaa ilman uutta FMEA:ta"],a:1,e:"Uusi tapa tehdä työtä muuttaa riskiprofiilin. FMEA:ta päivitetään aina, kun prosessi muuttuu merkittävästi."}]}
]},

{id:"ph5",code:"C",name:"Control",tag:"Parannuksen vakiinnuttaminen",lessons:[

{id:"l51",title:"Ohjauskortit",sub:"Yleissyy, erikoissyy ja kortin valinta",
theory:[
{t:"p",x:"Ohjauskortti (control chart) erottaa prosessin normaalin vaihtelun poikkeuksellisesta. Tämä on Control-vaiheen ydin: ilman erottelua reagoidaan kohinaan ja tehdään prosessista huonompi."},
{t:"h",x:"Kaksi vaihtelun lajia"},
{t:"tbl",h:["","Yleissyy (common cause)","Erikoissyy (special cause)"],r:[
["Luonne","Prosessiin sisäänrakennettu, satunnainen","Ulkopuolinen, tunnistettava tapahtuma"],
["Näkyy kortilla","Pisteet rajojen sisällä, satunnainen kuvio","Piste rajan ulkopuolella tai systemaattinen kuvio"],
["Vastuu","Johto: prosessi on muutettava","Prosessin tekijä: syy etsitään ja poistetaan"],
["Väärä reaktio","Säätäminen lisää vaihtelua (tampering)","Sivuuttaminen tekee poikkeamasta pysyvän"]]},
{t:"note",x:"<b>Ohjausrajat ≠ spesifikaatiorajat.</b> Ohjausrajat lasketaan prosessin omasta datasta (±3σ keskiarvosta) ja kertovat mihin prosessi kykenee. Spesifikaatiorajat tulevat asiakkaalta ja kertovat mitä vaaditaan. Niitä ei koskaan piirretä samaan ohjauskorttiin."},
{t:"h",x:"Kortin valinta"},
{t:"tbl",h:["Data","Tilanne","Kortti"],r:[
["Jatkuva","Yksittäisiä havaintoja","I-MR"],
["Jatkuva","Alaryhmiä, koko 2–9","X̄-R"],
["Jatkuva","Alaryhmiä, koko ≥ 10","X̄-S"],
["Attribuutti","Viallisten osuus, vaihteleva otos","p"],
["Attribuutti","Viallisten määrä, vakio otos","np"],
["Attribuutti","Vikojen määrä, vakio otos","c"],
["Attribuutti","Vikoja yksikköä kohti, vaihteleva otos","u"]]},
{t:"h",x:"Erikoissyyn tunnusmerkit"},
{t:"l",x:["Yksi piste ohjausrajojen ulkopuolella.","7–8 peräkkäistä pistettä samalla puolella keskiviivaa.","6–7 peräkkäistä pistettä nousevana tai laskevana trendinä.","14 peräkkäistä pistettä vuorotellen ylös ja alas.","Epätavallinen kasautuminen keskiviivan lähelle tai rajojen läheisyyteen."]},
{t:"p",x:"Kortti perustetaan vähintään 20–25 alaryhmästä. Kun prosessia on muutettu Improve-vaiheessa, ohjausrajat lasketaan uudelleen — vanhat rajat kuvaavat vanhaa prosessia."}],
q:[
{k:"mc",q:"Kaikki pisteet ovat ohjausrajojen sisällä, mutta 9 viimeistä ovat keskiviivan yläpuolella. Mitä tämä on?",o:["Normaalia yleissyyvaihtelua","Erikoissyy: prosessi on siirtynyt","Mittausvirhe","Merkki hyvästä suorituskyvystä"],a:1,e:"Systemaattinen kuvio on erikoissyyn merkki, vaikka rajat eivät ylity. Peräkkäiset pisteet samalla puolella osoittavat tason siirtymän."},
{k:"mc",q:"Seurataan viallisten osuutta päivittäisistä erilaisen kokoisista eristä. Mikä kortti?",o:["I-MR","X̄-R","p-kortti","c-kortti"],a:2,e:"Viallisten osuus ja vaihteleva otoskoko → p-kortti. c-kortti laskee vikojen määrää vakio-otoksesta."},
{k:"tf",q:"Spesifikaatiorajat kannattaa piirtää ohjauskorttiin, jotta nähdään täyttääkö prosessi vaatimukset.",a:false,e:"Niitä ei sekoiteta. Ohjausrajat kuvaavat prosessin ääntä, spesifikaatiorajat asiakkaan ääntä. Sekoittaminen johtaa turhaan säätämiseen."},
{k:"mc",q:"Prosessi on tilastollisesti ohjauksessa, mutta operaattori säätää parametreja jokaisen keskiarvosta poikkeavan pisteen jälkeen. Mitä tapahtuu?",o:["Vaihtelu pienenee","Vaihtelu kasvaa (tampering)","Ohjausrajat kapenevat","Cpk nousee"],a:1,e:"Yleissyyvaihteluun reagoiminen lisää vaihtelua. Tämä on Demingin kuvaama tampering-ilmiö."},
{k:"mc",q:"Mittaus tehdään yksittäisistä havainnoista, yksi arvo kerrallaan, data on jatkuvaa. Mikä kortti?",o:["I-MR","X̄-S","np","u"],a:0,e:"I-MR (individuals and moving range) on tarkoitettu yksittäisille havainnoille, kun alaryhmiä ei voi muodostaa."},
{k:"match",q:"Yhdistä havainto tulkintaan.",pairs:[["Piste ohjausrajan ulkopuolella","Erikoissyy, selvitä tapahtuma"],["Satunnainen kuvio rajojen sisällä","Yleissyy, älä säädä"],["7 nousevaa pistettä","Trendi, erikoissyy"],["Prosessi muutettu Improve-vaiheessa","Laske ohjausrajat uudelleen"]],e:"Kortin lukeminen on kuviontunnistusta, ei vain rajojen tarkistusta."}]},

{id:"l52",title:"Ohjaussuunnitelma ja standardityö",sub:"Miten parannus ei valu takaisin",
theory:[
{t:"p",x:"Control-vaiheen tehtävä on varmistaa, että parannus säilyy ilman projektitiimin läsnäoloa. Ilman tätä tyypillinen prosessi palautuu lähtötasolle 6–12 kuukaudessa."},
{t:"h",x:"Ohjaussuunnitelma (control plan)"},

/* ============ tila ja tallennus ============ */
const KEY="lss-gb-progress-v1";
const THEME_KEY="lss-gb-theme";
const PASS=0.8;
let P={lessons:{},hist:[],tot:{c:0,n:0}};
let S={view:"home",phase:null,lesson:null,quiz:null};
let storageOK=true;

function loadP(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);P={lessons:d.lessons||{},hist:d.hist||[],tot:d.tot||{c:0,n:0}};}
  }catch(e){/* yksityinen selaus, evästeet estetty tms. */ storageOK=false;}
}
function saveP(){
  try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){storageOK=false;}
}

/* ============ tumma / vaalea tila ============ */
function effectiveTheme(){
  let t=null;
  try{t=localStorage.getItem(THEME_KEY);}catch(e){/* ei käytettävissä */}
  if(t==="light"||t==="dark")return t;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
}
function applyTheme(){
  const stored=(()=>{try{return localStorage.getItem(THEME_KEY);}catch(e){return null;}})();
  if(stored==="light"||stored==="dark")document.documentElement.setAttribute("data-theme",stored);
  else document.documentElement.removeAttribute("data-theme");
  const btn=$("theme-toggle");
  if(btn)btn.textContent=effectiveTheme()==="dark"?"Vaalea tila":"Tumma tila";
}
function toggleTheme(){
  const next=effectiveTheme()==="dark"?"light":"dark";
  try{localStorage.setItem(THEME_KEY,next);}catch(e){/* ei käytettävissä, vaihtuu vain tälle istunnolle */}
  applyTheme();
}

/* ============ apurit ============ */
const $=id=>document.getElementById(id);
const allLessons=()=>CURRICULUM.flatMap(p=>p.lessons);
const lessonById=id=>allLessons().find(l=>l.id===id);
const phaseOf=id=>CURRICULUM.find(p=>p.lessons.some(l=>l.id===id));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function phasePct(p){const d=p.lessons.filter(l=>P.lessons[l.id]&&P.lessons[l.id].done).length;return Math.round(d/p.lessons.length*100);}
function totalPct(){const all=allLessons();const d=all.filter(l=>P.lessons[l.id]&&P.lessons[l.id].done).length;return Math.round(d/all.length*100);}
function accuracy(){return P.tot.n?P.tot.c/P.tot.n:0;}
function attemptedLessons(){return allLessons().filter(l=>P.lessons[l.id]);}
function weakestLessons(n){
  return allLessons()
    .map(l=>({l,score:P.lessons[l.id]?P.lessons[l.id].best:-1}))
    .sort((a,b)=>a.score-b.score)
    .slice(0,n)
    .map(x=>x.l);
}
function sigmaLevel(){
  const p=accuracy(); if(P.tot.n<10) return null;
  const dpmo=Math.max((1-p)*1e6,3.4);
  const v=29.37-2.221*Math.log(dpmo);
  if(v<=0) return 6;
  return Math.max(0,0.8406+Math.sqrt(v));
}

/* ============ ohjauskortti (allekirjoituselementti) ============ */
function controlChart(){
  const h=P.hist;
  if(h.length<5) return '<div class="chart-card"><p class="eyebrow">Suorituskykykortti</p><p style="margin:8px 0 4px;font-size:14.5px;color:rgba(239,237,228,.72)">Kortti piirtyy, kun olet vastannut viiteen kysymykseen. Jokainen piste on liukuva osuvuus viimeisistä viidestä vastauksesta.</p></div>';
  const w=5,pts=[];
  for(let i=w-1;i<h.length;i++){let s=0;for(let j=i-w+1;j<=i;j++)s+=h[j];pts.push(s/w);}
  const show=pts.slice(-45);
  const W=680,H=170;
  const L=34,R=12,T=14,B=22;
  const x=i=>L+(show.length<2?0:i*(W-L-R)/(show.length-1));
  const y=v=>T+(1-v)*(H-T-B);
  const line=show.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const mean=show.reduce((a,b)=>a+b,0)/show.length;
  const dots=show.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${v<PASS?"#E4796A":"#8FD3BE"}"/>`).join("");
  const gl=[0,.5,PASS,1].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="${v===PASS?"#E0A30F":"rgba(239,237,228,.16)"}" stroke-width="1" ${v===PASS?'stroke-dasharray="5 4"':''}/><text x="0" y="${y(v)+4}" fill="rgba(239,237,228,.5)" font-family="IBM Plex Mono, monospace" font-size="10">${Math.round(v*100)}%</text>`).join("");
  return `<div class="chart-card">
    <p class="eyebrow">Suorituskykykortti · liukuva osuvuus (n=5)</p>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Liukuva osuvuus viimeisistä vastauksista">
      ${gl}
      <line x1="${L}" y1="${y(mean)}" x2="${W-R}" y2="${y(mean)}" stroke="rgba(239,237,228,.55)" stroke-width="1"/>
      <path d="${line}" fill="none" stroke="#EFEDE4" stroke-width="1.6" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="chart-legend">
      <span><i style="background:#E0A30F"></i>Tavoiteraja 80 %</span>
      <span><i style="background:rgba(239,237,228,.55)"></i>Keskitaso ${Math.round(mean*100)} %</span>
      <span><i style="background:#E4796A"></i>Rajan alle jääneet</span>
    </div>
  </div>`;
}

/* ============ näkymät ============ */
function renderRail(){
  $("rail").innerHTML='<p class="rail-title">Vaiheet</p>'+CURRICULUM.map(p=>{
    const pc=phasePct(p);
    return `<button class="phase-btn ${S.phase===p.id?"on":""} ${pc===100?"full":""}" data-ph="${p.id}" aria-pressed="${S.phase===p.id}">
      <span class="code">${p.code}</span><span>${p.name}</span><span class="pct">${pc}%</span></button>`;
  }).join("");
  $("rail").querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{S.view="phase";S.phase=b.dataset.ph;render();});
  $("hdr-pct").textContent=totalPct()+" %";
}

    <div class="stat"><b>${sg?sg.toFixed(2)+"σ":"–"}</b><span>Harjoitussigma</span></div>
  </div>
  ${controlChart()}
  <hr class="rule">
  <h3 class="sec" style="margin-top:0">Vaiheet</h3>
  ${CURRICULUM.map(p=>`<button class="lesson-row" data-ph="${p.id}">
    <span class="idx">${p.code}</span>
    <span class="ttl">${p.name}<small>${p.tag}</small></span>
    <span class="badge ${phasePct(p)===100?"ok":phasePct(p)>0?"mid":""}">${phasePct(p)} %</span></button>`).join("")}
  <div class="foot">
    <small>${storageOK?"Edistyminen tallentuu automaattisesti":"Tallennus ei käytettävissä — edistyminen katoaa sivun sulkeutuessa"}</small>
    <button class="btn ghost sm" id="reset">Nollaa edistyminen</button>
  </div>`;
}

function phaseView(){
  const p=CURRICULUM.find(x=>x.id===S.phase);
  return `<p class="eyebrow">Vaihe ${p.code}</p>
  <h2 class="big">${p.name}</h2>
  <p class="lede" style="margin-bottom:22px">${p.tag}</p>
  ${p.lessons.map((l,i)=>{
    const st=P.lessons[l.id];
    const b=st?(st.done?`<span class="badge ok">${Math.round(st.best*100)} %</span>`:`<span class="badge mid">${Math.round(st.best*100)} %</span>`):`<span class="badge">${l.q.length} kysymystä</span>`;
    return `<button class="lesson-row" data-ls="${l.id}"><span class="idx">${p.code}.${i+1}</span>
      <span class="ttl">${l.title}<small>${l.sub}</small></span>${b}</button>`;}).join("")}`;
}

function theoryBlock(b){
  if(b.t==="p")return `<p>${b.x}</p>`;
  if(b.t==="h")return `<h3 class="sec">${b.x}</h3>`;
  if(b.t==="l")return `<ul class="bul">${b.x.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(b.t==="note")return `<div class="note">${b.x}</div>`;
  if(b.t==="f")return `<div class="formula">${b.x}</div>`;
  if(b.t==="tbl")return `<div class="tbl-wrap"><table><thead><tr>${b.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}

function lessonView(){
  const l=lessonById(S.lesson),p=phaseOf(S.lesson);
  const i=p.lessons.indexOf(l)+1;
  return `<p class="eyebrow">${p.name} · oppitunti ${p.code}.${i}</p>
  <h2 class="big" style="font-size:clamp(24px,4.6vw,32px)">${l.title}</h2>
  <p class="lede" style="margin-bottom:20px">${l.sub}</p>
  <div class="card">${l.theory.map(theoryBlock).join("")}</div>
  <div class="btn-row"><button class="btn" id="start-q">Harjoitukset · ${l.q.length} kysymystä</button>
  <button class="btn ghost" id="back-ph">Takaisin vaiheeseen</button></div>`;
}

/* ============ harjoitukset ============ */
function startQuiz(items,title,lessonId){
  S.quiz={items:items,i:0,correct:0,answered:false,title:title,lessonId:lessonId,sel:null,match:{},wrong:[]};
  S.view="quiz";render();
}
function quizView(){
  const q=S.quiz,it=q.items[q.i];
  const types={mc:"Monivalinta",tf:"Tosi vai epätosi",match:"Paritustehtävä"};
  let body="";
  if(it.k==="mc"){
    body=it.o.map((o,i)=>{
      let cls="opt";
      if(q.answered){if(i===it.a)cls+=" correct";else if(i===q.sel)cls+=" wrong";else cls+=" dim";}
      return `<button class="${cls}" data-o="${i}" ${q.answered?"disabled":""}><span class="key">${"ABCD"[i]}</span><span>${o}</span></button>`;}).join("");
  }else if(it.k==="tf"){
    const opts=[["Tosi",true],["Epätosi",false]];
    body='<div class="tf-row">'+opts.map((o,i)=>{
      let cls="opt";
      if(q.answered){if(o[1]===it.a)cls+=" correct";else if(i===q.sel)cls+=" wrong";else cls+=" dim";}
      return `<button class="${cls}" data-o="${i}" ${q.answered?"disabled":""}><span class="key">${i+1}</span><span>${o[0]}</span></button>`;}).join("")+'</div>';
  }else{
    if(!q.opts)q.opts=shuffle(it.pairs.map(p=>p[1]));
    body=it.pairs.map((p,i)=>{
      let cls="";
      if(q.answered)cls=(q.match[i]===p[1])?"ok":"no";
      return `<div class="match-row"><span class="lt">${p[0]}</span>
        <select data-m="${i}" class="${cls}" ${q.answered?"disabled":""}>
        <option value="">— valitse —</option>
        ${q.opts.map(o=>`<option ${q.match[i]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;}).join("")
        +(q.answered?"":'<div class="btn-row"><button class="btn" id="check-m">Tarkista</button></div>');
  }
  let verdict="";
  if(q.answered){
    const ok=q.lastOK;
    let extra="";
    if(it.k==="match"&&!ok)extra=" Oikeat parit: "+it.pairs.map(p=>`${p[0]} → ${p[1]}`).join("; ")+".";
    verdict=`<div class="verdict ${ok?"y":"n"}" role="status" aria-live="polite"><h4>${ok?"Oikein":"Väärin"}</h4><p>${it.e}${extra}</p></div>
    <div class="btn-row"><button class="btn" id="next-q">${q.i+1<q.items.length?"Seuraava kysymys":"Näytä tulos"}</button></div>`;
  }
  return `<div class="qhead"><span class="qtype">${types[it.k]}</span>
    <span class="qtype">${q.i+1} / ${q.items.length} · ${q.title}</span></div>
    <div class="qbar"><i style="width:${(q.i)/q.items.length*100}%"></i></div>
    <p class="qtext">${it.q}</p>${body}${verdict}`;
}

function grade(ok){
  const q=S.quiz;
  q.answered=true;q.lastOK=ok;
  if(ok)q.correct++;else q.wrong.push(q.items[q.i]);
  P.tot.n++;if(ok)P.tot.c++;
  P.hist.push(ok?1:0);if(P.hist.length>120)P.hist=P.hist.slice(-120);
  saveP();render();
}

function resultView(){
  const q=S.quiz,sc=q.correct/q.items.length,pass=sc>=PASS;
  let msg;
  if(sc===1)msg="Täydet pisteet. Aihe on hallussa.";
  else if(pass)msg="Läpi. Käy väärin menneiden selitykset läpi ennen seuraavaa osiota.";
  else if(sc>=0.5)msg="Osa on hallussa. Lue teoria uudelleen ja tee harjoitukset toistamiseen.";
  else msg="Tulos jäi matalaksi. Palaa teoriaan; harjoitukset kannattaa uusia heti perään.";
  return `<p class="eyebrow">Tulos · ${q.title}</p>
  <h2 class="big">${q.correct} / ${q.items.length}<span style="font-size:.45em;color:var(--ink-3)"> · ${Math.round(sc*100)} %</span></h2>
  <p class="lede" style="max-width:52ch;margin-bottom:20px">${msg}</p>
  <div class="stat-grid">
    <div class="stat"><b>${Math.round(sc*100)} %</b><span>Tämä osio</span></div>
    <div class="stat"><b>${Math.round(accuracy()*100)} %</b><span>Kaikki yhteensä</span></div>
    <div class="stat"><b>${pass?"Suoritettu":"Kesken"}</b><span>Tila</span></div>
  </div>
  ${controlChart()}
  <div class="btn-row">
    <button class="btn" id="retry">Tee uudelleen</button>
    ${q.wrong.length?`<button class="btn ghost" id="retry-wrong">Kertaa väärät (${q.wrong.length})</button>`:""}
    ${q.lessonId?'<button class="btn ghost" id="re-theory">Takaisin teoriaan</button>':""}
    <button class="btn ghost" id="to-home">Etusivulle</button>
  </div>`;
}

/* ============ render ============ */
function render(){
  renderRail();
  const v=$("view");
  if(S.view==="home")v.innerHTML=homeView();
  else if(S.view==="phase")v.innerHTML=phaseView();
  else if(S.view==="lesson")v.innerHTML=lessonView();
  else if(S.view==="quiz")v.innerHTML=quizView();
  else if(S.view==="result")v.innerHTML=resultView();
  bind();
  window.scrollTo({top:0,behavior:"instant"});
}

function bind(){
  const v=$("view");
  v.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{S.view="phase";S.phase=b.dataset.ph;render();});
  v.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{S.view="lesson";S.lesson=b.dataset.ls;render();});
  const g=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};

  g("go-next",()=>{
    const nxt=allLessons().find(l=>!(P.lessons[l.id]&&P.lessons[l.id].done))||allLessons()[0];
    S.view="lesson";S.lesson=nxt.id;S.phase=phaseOf(nxt.id).id;render();});
  g("go-exam",()=>{
    const pool=shuffle(allLessons().flatMap(l=>l.q)).slice(0,20);
    startQuiz(pool,"Loppukoe",null);});
  g("go-weak",()=>{
    const ls=weakestLessons(3);
    const pool=shuffle(ls.flatMap(l=>l.q)).slice(0,15);
    startQuiz(pool,"Heikoimmat aiheet",null);});
  g("reset",()=>{
    if(!confirm("Nollataanko kaikki edistyminen, pisteet ja suorituskykykortti?"))return;
    P={lessons:{},hist:[],tot:{c:0,n:0}};saveP();S.view="home";render();});
  g("start-q",()=>{const l=lessonById(S.lesson);startQuiz(l.q,l.title,l.id);});
  g("back-ph",()=>{S.view="phase";S.phase=phaseOf(S.lesson).id;render();});
  g("to-home",()=>{S.view="home";S.phase=null;render();});
  g("re-theory",()=>{S.view="lesson";S.lesson=S.quiz.lessonId;render();});
  g("retry",()=>{const q=S.quiz;startQuiz(q.lessonId?lessonById(q.lessonId).q:shuffle(allLessons().flatMap(l=>l.q)).slice(0,20),q.title,q.lessonId);});
  g("retry-wrong",()=>{const w=S.quiz.wrong;startQuiz(shuffle(w),S.quiz.title+" · väärät kertaus",null);});

  if(S.view==="quiz"){
    const q=S.quiz,it=q.items[q.i];
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o;q.sel=i;
      grade(it.k==="mc"?i===it.a:(i===0)===it.a);});
    v.querySelectorAll("[data-m]").forEach(s=>s.onchange=()=>{q.match[+s.dataset.m]=s.value;});
    g("check-m",()=>{
      if(it.pairs.some((p,i)=>!q.match[i])){alert("Valitse pari jokaiselle riville.");return;}
      grade(it.pairs.every((p,i)=>q.match[i]===p[1]));});
    g("next-q",()=>{
      if(q.i+1<q.items.length){q.i++;q.answered=false;q.sel=null;q.match={};q.opts=null;render();}
      else{
        const sc=q.correct/q.items.length;
        if(q.lessonId){
          const st=P.lessons[q.lessonId]||{best:0,attempts:0};
          st.attempts++;st.best=Math.max(st.best,sc);st.done=st.best>=PASS;
          P.lessons[q.lessonId]=st;saveP();}
        S.view="result";render();}});
  }
}

document.onkeydown=e=>{
  if(S.view!=="quiz")return;
  const q=S.quiz,it=q.items[q.i];
  if(q.answered&&(e.key==="Enter"||e.key===" ")){const n=$("next-q");if(n){e.preventDefault();n.click();}return;}
  if(!q.answered&&it.k!=="match"){
    const n=parseInt(e.key,10);
    const max=it.k==="mc"?it.o.length:2;
    if(n>=1&&n<=max){const b=document.querySelector(`[data-o="${n-1}"]`);if(b)b.click();}}
};

$("home-btn").onclick=()=>{S.view="home";S.phase=null;render();};
$("theme-toggle").onclick=toggleTheme;
applyTheme();
loadP();
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
</script>
</body>
</html>
