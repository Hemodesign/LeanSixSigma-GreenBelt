/* ============ tila ja tallennus ============ */
const KEY="lss-gb-progress-v1";
const THEME_KEY="lss-gb-theme";
const PASS=0.8;
let P={lessons:{},hist:[],tot:{c:0,n:0}};
let S={view:"home",phase:null,lesson:null,quiz:null};
let storageOK=true;

function loadP(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);P={lessons:d.lessons||{},hist:d.hist||[],tot:d.tot||{c:0,n:0}};}
  }catch(e){/* yksityinen selaus, evästeet estetty tms. */ storageOK=false;}
}
function saveP(){
  try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){storageOK=false;}
}

/* ============ tumma / vaalea tila ============ */
function effectiveTheme(){
  let t=null;
  try{t=localStorage.getItem(THEME_KEY);}catch(e){/* ei käytettävissä */}
  if(t==="light"||t==="dark")return t;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
}
function applyTheme(){
  const stored=(()=>{try{return localStorage.getItem(THEME_KEY);}catch(e){return null;}})();
  if(stored==="light"||stored==="dark")document.documentElement.setAttribute("data-theme",stored);
  else document.documentElement.removeAttribute("data-theme");
  const btn=$("theme-toggle");
  if(btn)btn.textContent=effectiveTheme()==="dark"?"Vaalea tila":"Tumma tila";
}
function toggleTheme(){
  const next=effectiveTheme()==="dark"?"light":"dark";
  try{localStorage.setItem(THEME_KEY,next);}catch(e){/* ei käytettävissä, vaihtuu vain tälle istunnolle */}
  applyTheme();
}

/* ============ apurit ============ */
const $=id=>document.getElementById(id);
const allLessons=()=>CURRICULUM.flatMap(p=>p.lessons);
const lessonById=id=>allLessons().find(l=>l.id===id);
const phaseOf=id=>CURRICULUM.find(p=>p.lessons.some(l=>l.id===id));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function phasePct(p){const d=p.lessons.filter(l=>P.lessons[l.id]&&P.lessons[l.id].done).length;return Math.round(d/p.lessons.length*100);}
function totalPct(){const all=allLessons();const d=all.filter(l=>P.lessons[l.id]&&P.lessons[l.id].done).length;return Math.round(d/all.length*100);}
function accuracy(){return P.tot.n?P.tot.c/P.tot.n:0;}
function attemptedLessons(){return allLessons().filter(l=>P.lessons[l.id]);}
function weakestLessons(n){
  return allLessons()
    .map(l=>({l,score:P.lessons[l.id]?P.lessons[l.id].best:-1}))
    .sort((a,b)=>a.score-b.score)
    .slice(0,n)
    .map(x=>x.l);
}
function sigmaLevel(){
  const p=accuracy(); if(P.tot.n<10) return null;
  const dpmo=Math.max((1-p)*1e6,3.4);
  const v=29.37-2.221*Math.log(dpmo);
  if(v<=0) return 6;
  return Math.max(0,0.8406+Math.sqrt(v));
}

/* ============ ohjauskortti (allekirjoituselementti) ============ */
function controlChart(){
  const h=P.hist;
  if(h.length<5) return '<div class="chart-card"><p class="eyebrow">Suorituskykykortti</p><p style="margin:8px 0 4px;font-size:14.5px;color:rgba(239,237,228,.72)">Kortti piirtyy, kun olet vastannut viiteen kysymykseen. Jokainen piste on liukuva osuvuus viimeisistä viidestä vastauksesta.</p></div>';
  const w=5,pts=[];
  for(let i=w-1;i<h.length;i++){let s=0;for(let j=i-w+1;j<=i;j++)s+=h[j];pts.push(s/w);}
  const show=pts.slice(-45);
  const W=680,H=170;
  const L=34,R=12,T=14,B=22;
  const x=i=>L+(show.length<2?0:i*(W-L-R)/(show.length-1));
  const y=v=>T+(1-v)*(H-T-B);
  const line=show.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const mean=show.reduce((a,b)=>a+b,0)/show.length;
  const dots=show.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${v<PASS?"#E4796A":"#8FD3BE"}"/>`).join("");
  const gl=[0,.5,PASS,1].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="${v===PASS?"#E0A30F":"rgba(239,237,228,.16)"}" stroke-width="1" ${v===PASS?'stroke-dasharray="5 4"':''}/><text x="0" y="${y(v)+4}" fill="rgba(239,237,228,.5)" font-family="IBM Plex Mono, monospace" font-size="10">${Math.round(v*100)}%</text>`).join("");
  return `<div class="chart-card">
    <p class="eyebrow">Suorituskykykortti · liukuva osuvuus (n=5)</p>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Liukuva osuvuus viimeisistä vastauksista">
      ${gl}
      <line x1="${L}" y1="${y(mean)}" x2="${W-R}" y2="${y(mean)}" stroke="rgba(239,237,228,.55)" stroke-width="1"/>
      <path d="${line}" fill="none" stroke="#EFEDE4" stroke-width="1.6" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="chart-legend">
      <span><i style="background:#E0A30F"></i>Tavoiteraja 80 %</span>
      <span><i style="background:rgba(239,237,228,.55)"></i>Keskitaso ${Math.round(mean*100)} %</span>
      <span><i style="background:#E4796A"></i>Rajan alle jääneet</span>
    </div>
  </div>`;
}

/* ============ näkymät ============ */
function renderRail(){
  $("rail").innerHTML='<p class="rail-title">Vaiheet</p>'+CURRICULUM.map(p=>{
    const pc=phasePct(p);
    return `<button class="phase-btn ${S.phase===p.id?"on":""} ${pc===100?"full":""}" data-ph="${p.id}" aria-pressed="${S.phase===p.id}">
      <span class="code">${p.code}</span><span>${p.name}</span><span class="pct">${pc}%</span></button>`;
  }).join("");
  $("rail").querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{S.view="phase";S.phase=b.dataset.ph;render();});
  $("hdr-pct").textContent=totalPct()+" %";
}

  <h2 class="big">Opettele Lean Six Sigma<br>kysymys kerrallaan.</h2>
  <p class="lede" style="max-width:56ch">Kuusi vaihetta, ${allLessons().length} oppituntia ja ${allLessons().reduce((a,l)=>a+l.q.length,0)} harjoitusta. Jokainen oppitunti alkaa teoriasta ja päättyy harjoituksiin: monivalintoihin, tosi/epätosi-väittämiin ja paritustehtäviin. Oppitunti merkitään suoritetuksi ${Math.round(PASS*100)} %:n tuloksella.</p>
  <div class="btn-row" style="margin-bottom:26px">
    <button class="btn" id="go-next">${done? "Jatka siitä mihin jäit":"Aloita perusteista"}</button>
    ${attemptedLessons().length?'<button class="btn ghost" id="go-weak">Harjoittele heikoimmat aiheet</button>':''}
    ${P.tot.n>=20?'<button class="btn ghost" id="go-exam">Loppukoe · 20 kysymystä</button>':''}
  </div>
  <div class="stat-grid">
    <div class="stat"><b>${done}/${allLessons().length}</b><span>Oppituntia</span></div>
    <div class="stat"><b>${P.tot.n?Math.round(accuracy()*100):"–"} %</b><span>Osuvuus</span></div>
    <div class="stat"><b>${sg?sg.toFixed(2)+"σ":"–"}</b><span>Harjoitussigma</span></div>
  </div>
  ${controlChart()}
  <hr class="rule">
  <h3 class="sec" style="margin-top:0">Vaiheet</h3>
  ${CURRICULUM.map(p=>`<button class="lesson-row" data-ph="${p.id}">
    <span class="idx">${p.code}</span>
    <span class="ttl">${p.name}<small>${p.tag}</small></span>
    <span class="badge ${phasePct(p)===100?"ok":phasePct(p)>0?"mid":""}">${phasePct(p)} %</span></button>`).join("")}
  <div class="foot">
    <small>${storageOK?"Edistyminen tallentuu automaattisesti":"Tallennus ei käytettävissä — edistyminen katoaa sivun sulkeutuessa"}</small>
    <button class="btn ghost sm" id="reset">Nollaa edistyminen</button>
  </div>`;
}

function phaseView(){
  const p=CURRICULUM.find(x=>x.id===S.phase);
  return `<p class="eyebrow">Vaihe ${p.code}</p>
  <h2 class="big">${p.name}</h2>
  <p class="lede" style="margin-bottom:22px">${p.tag}</p>
  ${p.lessons.map((l,i)=>{
    const st=P.lessons[l.id];
    const b=st?(st.done?`<span class="badge ok">${Math.round(st.best*100)} %</span>`:`<span class="badge mid">${Math.round(st.best*100)} %</span>`):`<span class="badge">${l.q.length} kysymystä</span>`;
    return `<button class="lesson-row" data-ls="${l.id}"><span class="idx">${p.code}.${i+1}</span>
      <span class="ttl">${l.title}<small>${l.sub}</small></span>${b}</button>`;}).join("")}`;
}

function theoryBlock(b){
  if(b.t==="p")return `<p>${b.x}</p>`;
  if(b.t==="h")return `<h3 class="sec">${b.x}</h3>`;
  if(b.t==="l")return `<ul class="bul">${b.x.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(b.t==="note")return `<div class="note">${b.x}</div>`;
  if(b.t==="f")return `<div class="formula">${b.x}</div>`;
  if(b.t==="tbl")return `<div class="tbl-wrap"><table><thead><tr>${b.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}

function lessonView(){
  const l=lessonById(S.lesson),p=phaseOf(S.lesson);
  const i=p.lessons.indexOf(l)+1;
  return `<p class="eyebrow">${p.name} · oppitunti ${p.code}.${i}</p>
  <h2 class="big" style="font-size:clamp(24px,4.6vw,32px)">${l.title}</h2>
  <p class="lede" style="margin-bottom:20px">${l.sub}</p>
  <div class="card">${l.theory.map(theoryBlock).join("")}</div>
  <div class="btn-row"><button class="btn" id="start-q">Harjoitukset · ${l.q.length} kysymystä</button>
  <button class="btn ghost" id="back-ph">Takaisin vaiheeseen</button></div>`;
}

/* ============ harjoitukset ============ */
function startQuiz(items,title,lessonId){
  S.quiz={items:items,i:0,correct:0,answered:false,title:title,lessonId:lessonId,sel:null,match:{},wrong:[]};
  S.view="quiz";render();
}
function quizView(){
  const q=S.quiz,it=q.items[q.i];
  const types={mc:"Monivalinta",tf:"Tosi vai epätosi",match:"Paritustehtävä"};
  let body="";
  if(it.k==="mc"){
    body=it.o.map((o,i)=>{
      let cls="opt";
      if(q.answered){if(i===it.a)cls+=" correct";else if(i===q.sel)cls+=" wrong";else cls+=" dim";}
      return `<button class="${cls}" data-o="${i}" ${q.answered?"disabled":""}><span class="key">${"ABCD"[i]}</span><span>${o}</span></button>`;}).join("");
  }else if(it.k==="tf"){
    const opts=[["Tosi",true],["Epätosi",false]];
    body='<div class="tf-row">'+opts.map((o,i)=>{
      let cls="opt";
      if(q.answered){if(o[1]===it.a)cls+=" correct";else if(i===q.sel)cls+=" wrong";else cls+=" dim";}
      return `<button class="${cls}" data-o="${i}" ${q.answered?"disabled":""}><span class="key">${i+1}</span><span>${o[0]}</span></button>`;}).join("")+'</div>';
  }else{
    if(!q.opts)q.opts=shuffle(it.pairs.map(p=>p[1]));
    body=it.pairs.map((p,i)=>{
      let cls="";
      if(q.answered)cls=(q.match[i]===p[1])?"ok":"no";
      return `<div class="match-row"><span class="lt">${p[0]}</span>
        <select data-m="${i}" class="${cls}" ${q.answered?"disabled":""}>
        <option value="">— valitse —</option>
        ${q.opts.map(o=>`<option ${q.match[i]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;}).join("")
        +(q.answered?"":'<div class="btn-row"><button class="btn" id="check-m">Tarkista</button></div>');
  }
  let verdict="";
  if(q.answered){
    const ok=q.lastOK;
    let extra="";
    if(it.k==="match"&&!ok)extra=" Oikeat parit: "+it.pairs.map(p=>`${p[0]} → ${p[1]}`).join("; ")+".";
    verdict=`<div class="verdict ${ok?"y":"n"}" role="status" aria-live="polite"><h4>${ok?"Oikein":"Väärin"}</h4><p>${it.e}${extra}</p></div>
    <div class="btn-row"><button class="btn" id="next-q">${q.i+1<q.items.length?"Seuraava kysymys":"Näytä tulos"}</button></div>`;
  }
  return `<div class="qhead"><span class="qtype">${types[it.k]}</span>
    <span class="qtype">${q.i+1} / ${q.items.length} · ${q.title}</span></div>
    <div class="qbar"><i style="width:${(q.i)/q.items.length*100}%"></i></div>
    <p class="qtext">${it.q}</p>${body}${verdict}`;
}

function grade(ok){
  const q=S.quiz;
  q.answered=true;q.lastOK=ok;
  if(ok)q.correct++;else q.wrong.push(q.items[q.i]);
  P.tot.n++;if(ok)P.tot.c++;
  P.hist.push(ok?1:0);if(P.hist.length>120)P.hist=P.hist.slice(-120);
  saveP();render();
}

function resultView(){
  const q=S.quiz,sc=q.correct/q.items.length,pass=sc>=PASS;
  let msg;
  if(sc===1)msg="Täydet pisteet. Aihe on hallussa.";
  else if(pass)msg="Läpi. Käy väärin menneiden selitykset läpi ennen seuraavaa osiota.";
  else if(sc>=0.5)msg="Osa on hallussa. Lue teoria uudelleen ja tee harjoitukset toistamiseen.";
  else msg="Tulos jäi matalaksi. Palaa teoriaan; harjoitukset kannattaa uusia heti perään.";
  return `<p class="eyebrow">Tulos · ${q.title}</p>
  <h2 class="big">${q.correct} / ${q.items.length}<span style="font-size:.45em;color:var(--ink-3)"> · ${Math.round(sc*100)} %</span></h2>
  <p class="lede" style="max-width:52ch;margin-bottom:20px">${msg}</p>
  <div class="stat-grid">
    <div class="stat"><b>${Math.round(sc*100)} %</b><span>Tämä osio</span></div>
    <div class="stat"><b>${Math.round(accuracy()*100)} %</b><span>Kaikki yhteensä</span></div>
    <div class="stat"><b>${pass?"Suoritettu":"Kesken"}</b><span>Tila</span></div>
  </div>
  ${controlChart()}
  <div class="btn-row">
    <button class="btn" id="retry">Tee uudelleen</button>
    ${q.wrong.length?`<button class="btn ghost" id="retry-wrong">Kertaa väärät (${q.wrong.length})</button>`:""}
    ${q.lessonId?'<button class="btn ghost" id="re-theory">Takaisin teoriaan</button>':""}
    <button class="btn ghost" id="to-home">Etusivulle</button>
  </div>`;
}

/* ============ render ============ */
function render(){
  renderRail();
  const v=$("view");
  if(S.view==="home")v.innerHTML=homeView();
  else if(S.view==="phase")v.innerHTML=phaseView();
  else if(S.view==="lesson")v.innerHTML=lessonView();
  else if(S.view==="quiz")v.innerHTML=quizView();
  else if(S.view==="result")v.innerHTML=resultView();
  bind();
  window.scrollTo({top:0,behavior:"instant"});
}

function bind(){
  const v=$("view");
  v.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{S.view="phase";S.phase=b.dataset.ph;render();});
  v.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{S.view="lesson";S.lesson=b.dataset.ls;render();});
  const g=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};

  g("go-next",()=>{
    const nxt=allLessons().find(l=>!(P.lessons[l.id]&&P.lessons[l.id].done))||allLessons()[0];
    S.view="lesson";S.lesson=nxt.id;S.phase=phaseOf(nxt.id).id;render();});
  g("go-exam",()=>{
    const pool=shuffle(allLessons().flatMap(l=>l.q)).slice(0,20);
    startQuiz(pool,"Loppukoe",null);});
  g("go-weak",()=>{
    const ls=weakestLessons(3);
    const pool=shuffle(ls.flatMap(l=>l.q)).slice(0,15);
    startQuiz(pool,"Heikoimmat aiheet",null);});
  g("reset",()=>{
    if(!confirm("Nollataanko kaikki edistyminen, pisteet ja suorituskykykortti?"))return;
    P={lessons:{},hist:[],tot:{c:0,n:0}};saveP();S.view="home";render();});
  g("start-q",()=>{const l=lessonById(S.lesson);startQuiz(l.q,l.title,l.id);});
  g("back-ph",()=>{S.view="phase";S.phase=phaseOf(S.lesson).id;render();});
  g("to-home",()=>{S.view="home";S.phase=null;render();});
  g("re-theory",()=>{S.view="lesson";S.lesson=S.quiz.lessonId;render();});
  g("retry",()=>{const q=S.quiz;startQuiz(q.lessonId?lessonById(q.lessonId).q:shuffle(allLessons().flatMap(l=>l.q)).slice(0,20),q.title,q.lessonId);});
  g("retry-wrong",()=>{const w=S.quiz.wrong;startQuiz(shuffle(w),S.quiz.title+" · väärät kertaus",null);});

  if(S.view==="quiz"){
    const q=S.quiz,it=q.items[q.i];
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.o;q.sel=i;
      grade(it.k==="mc"?i===it.a:(i===0)===it.a);});
    v.querySelectorAll("[data-m]").forEach(s=>s.onchange=()=>{q.match[+s.dataset.m]=s.value;});
    g("check-m",()=>{
      if(it.pairs.some((p,i)=>!q.match[i])){alert("Valitse pari jokaiselle riville.");return;}
      grade(it.pairs.every((p,i)=>q.match[i]===p[1]));});
    g("next-q",()=>{
      if(q.i+1<q.items.length){q.i++;q.answered=false;q.sel=null;q.match={};q.opts=null;render();}
      else{
        const sc=q.correct/q.items.length;
        if(q.lessonId){
          const st=P.lessons[q.lessonId]||{best:0,attempts:0};
          st.attempts++;st.best=Math.max(st.best,sc);st.done=st.best>=PASS;
          P.lessons[q.lessonId]=st;saveP();}
        S.view="result";render();}});
  }
}

document.onkeydown=e=>{
  if(S.view!=="quiz")return;
  const q=S.quiz,it=q.items[q.i];
  if(q.answered&&(e.key==="Enter"||e.key===" ")){const n=$("next-q");if(n){e.preventDefault();n.click();}return;}
  if(!q.answered&&it.k!=="match"){
    const n=parseInt(e.key,10);
    const max=it.k==="mc"?it.o.length:2;
    if(n>=1&&n<=max){const b=document.querySelector(`[data-o="${n-1}"]`);if(b)b.click();}}
};

$("home-btn").onclick=()=>{S.view="home";S.phase=null;render();};
$("theme-toggle").onclick=toggleTheme;
applyTheme();
loadP();
render();
</script>
</body>
</html>
